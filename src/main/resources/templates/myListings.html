<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Listings | Hamro Kitab</title>

    <link rel="stylesheet" th:href="@{/css/myListings.css}">

</head>

<body>


<div class="listings-container">

    <div th:if="${param.error}" class="alert error-alert">
        This book cannot be deleted because it has existing messages.
    </div>

    <div th:if="${param.success}" class="alert success-alert">
        Book deleted successfully.
    </div>
    <a th:href="@{/product}" class="back-link">
        ← Back to Books
    </a>

    <div class="page-header">

        <h1>My Listings</h1>

        <p>
            Books you have listed on Hamro Kitab
        </p>

    </div>


    <!-- No books -->

    <div class="empty-listings"
         th:if="${#lists.isEmpty(books)}">

        <div class="empty-icon">
            📚
        </div>

        <h2>No listings yet</h2>

        <p>
            You haven't added any books yet.
        </p>

        <a th:href="@{/addBook}" class="add-button">
            Add a Book
        </a>

    </div>


    <!-- Books -->

    <div class="book-list"
         th:unless="${#lists.isEmpty(books)}">

        <div class="book-card"
             th:each="book : ${books}">

            <div class="book-image">

                <img th:if="${book.image != null}"
                     th:src="'data:' + ${book.imageType} + ';base64,' + ${book.imageBase64}"
                     alt="Book Image">

                <div th:if="${book.image == null}"
                     class="no-image">
                    No Image
                </div>

            </div>


            <div class="book-information">

                <h2 th:text="${book.title}">
                    Book Title
                </h2>

                <p class="author"
                   th:text="'By ' + ${book.author}">
                    By Author
                </p>

                <p class="price"
                   th:text="'NPR ' + ${book.price}">
                    NPR 0
                </p>

                <p class="condition"
                   th:text="${book.condition}">
                    Condition
                </p>

                <div class="book-actions">

                    <a th:href="@{/bookdetail/{id}(id=${book.id})}"
                       class="view-button">
                        View Book
                    </a>

                    <a th:href="@{/editBook/{id}(id=${book.id})}"
                       class="edit-button">
                        Edit
                    </a>

                    <form th:action="@{/deleteBook}"
                          method="post"
                          onsubmit="return confirm('Are you sure you want to delete this book?');">

                        <input type="hidden"
                               name="bookId"
                               th:value="${book.id}">

                        <button type="submit" class="delete-button">
                            Delete
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
