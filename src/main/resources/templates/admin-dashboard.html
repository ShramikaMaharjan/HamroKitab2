<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard - HamroKitab</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fbfaf8;
      color: #252545;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* ================= HEADER ================= */

    .header {
      background: white;
      border-bottom: 1px solid #e8e7ef;
    }

    .header-container {
      max-width: 1150px;
      margin: auto;
      padding: 15px 25px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo img {
      width: 125px;
      display: block;
    }

    .admin-label {
      color: #363795;
      font-size: 13px;
      font-weight: bold;
    }

    /* ================= PAGE ================= */

    .container {
      max-width: 1150px;
      margin: auto;
      padding: 40px 25px;
    }

    .page-heading {
      margin-bottom: 30px;
    }

    .page-heading h1 {
      font-size: 30px;
      margin-bottom: 5px;
    }

    .page-heading p {
      color: #77778d;
      font-size: 14px;
    }

    /* ================= STATS ================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      border: 1px solid #e8e7ef;
      border-radius: 15px;
      padding: 25px;
    }

    .stat-label {
      color: #85859a;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .stat-number {
      color: #363795;
      font-size: 32px;
      font-weight: bold;
    }

    /* ================= ACTIONS ================= */

    .section {
      background: white;
      border: 1px solid #e8e7ef;
      border-radius: 15px;
      padding: 25px;
    }

    .section h2 {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .actions {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .action-btn {
      padding: 12px 18px;
      border-radius: 9px;
      background: #363795;
      color: white;
      font-size: 13px;
      font-weight: bold;
    }

    .action-btn:hover {
      background: #252545;
    }

    .logout {
      background: #f7f6fa;
      color: #363795;
    }

    @media (max-width: 600px) {

      .stats {
        grid-template-columns: 1fr;
      }

      .header-container {
        padding: 14px 18px;
      }

      .container {
        padding: 30px 18px;
      }

    }

  </style>

</head>

<body>

<header class="header">

  <div class="header-container">

    <a th:href="@{/}" class="logo">

      <img th:src="@{/images/logo.png}"
           alt="HamroKitab Logo">

    </a>

    <span class="admin-label">
            ADMIN PANEL
        </span>

  </div>

</header>


<main class="container">

  <div class="page-heading">

    <h1>Admin Dashboard</h1>

    <p>
      Manage users and books on HamroKitab.
    </p>

  </div>


  <!-- ================= STATISTICS ================= -->

  <div class="stats">

    <div class="stat-card">

      <div class="stat-label">
        Registered Users
      </div>

      <div class="stat-number"
           th:text="${userCount}">
        0
      </div>

    </div>


    <div class="stat-card">

      <div class="stat-label">
        Listed Books
      </div>

      <div class="stat-number"
           th:text="${bookCount}">
        0
      </div>

    </div>

  </div>


  <!-- ================= MANAGEMENT ================= -->

  <div class="section">

    <h2>Management</h2>

    <div class="actions">

      <a th:href="@{/admin/users}"
         class="action-btn">

        Manage Users

      </a>

      <a th:href="@{/admin/books}"
         class="action-btn">

        Manage Books

      </a>

      <a th:href="@{/}"
         class="action-btn logout">

        Back to Website

      </a>

      <a th:href="@{/logoutUser}"
         class="action-btn logout">

        Logout

      </a>

    </div>

  </div>

</main>

</body>

</html>
