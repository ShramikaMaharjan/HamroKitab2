<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Cart | Hamro Kitab</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "DM Sans", Arial, sans-serif;
            background: #fbfaf8;
            color: #252545;
        }

        .header {
            background: white;
            padding: 20px 7%;
            border-bottom: 1px solid #eeeeee;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #363795;
            text-decoration: none;
        }

        .page {
            max-width: 1000px;
            margin: 45px auto;
            padding: 0 25px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 25px;
            color: #363795;
            text-decoration: none;
            font-weight: 600;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .cart-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid #eeeeee;
        }

        .cart-item:first-child {
            padding-top: 0;
        }

        .book-image {
            width: 90px;
            height: 115px;
            border-radius: 8px;
            overflow: hidden;
            background: #f0f0f0;
            flex-shrink: 0;
        }

        .book-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .book-info {
            flex: 1;
        }

        .book-info h2 {
            font-size: 19px;
            margin-bottom: 5px;
        }

        .book-info p {
            color: #777;
            font-size: 14px;
            margin: 3px 0;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
            color: #363795;
            margin-top: 8px;
        }

        .remove-button {
            text-decoration: none;
            color: #d33;
            border: 1px solid #e5baba;
            padding: 8px 13px;
            border-radius: 7px;
            font-size: 13px;
        }

        .remove-button:hover {
            background: #fff2f2;
        }

        .cart-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 25px;
        }

        .total {
            font-size: 21px;
            font-weight: bold;
        }

        .checkout-button {
            text-decoration: none;
            background: #363795;
            color: white;
            padding: 13px 25px;
            border-radius: 9px;
            font-weight: bold;
        }

        .checkout-button:hover {
            opacity: 0.9;
        }

        .continue-button {
            display: inline-block;
            margin-top: 20px;
            color: #363795;
            text-decoration: none;
            font-weight: 600;
        }

        .empty-cart {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-cart h2 {
            margin-bottom: 10px;
        }

        .empty-cart p {
            color: #777;
            margin-bottom: 20px;
        }

        .browse-button {
            display: inline-block;
            background: #363795;
            color: white;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 9px;
            font-weight: bold;
        }

        @media (max-width: 650px) {

            .cart-item {
                align-items: flex-start;
            }

            .cart-bottom {
                flex-direction: column;
                align-items: stretch;
                gap: 20px;
            }

            .checkout-button {
                text-align: center;
            }

            .remove-button {
                font-size: 12px;
                padding: 7px 9px;
            }
        }

    </style>
    

</head>

<body>

<header class="header">

    
    <a href="/" class="logo">
        HamroKitab
    </a>
    

</header>

<main class="page">

    
    <a th:href="@{/product}" class="back-link">
        ← Continue Shopping
    </a>

    <h1>My Cart</h1>

    <p class="subtitle">
        Books you have added to your cart.
    </p>

    <!-- CART HAS BOOKS -->

    <div class="cart-container"
         th:if="${not #lists.isEmpty(cart)}">

        <div class="cart-item"
             th:each="book : ${cart}">

            <div class="book-image">

                <img th:if="${book.image != null}"
                     th:src="'data:' + ${book.imageType} + ';base64,' + ${book.imageBase64}"
                     alt="Book Image">

            </div>

            <div class="book-info">

                <h2 th:text="${book.title}">
                    Book Title
                </h2>

                <p>
                    By
                    <span th:text="${book.author}">
                    Author
                </span>
                </p>

                <p th:text="${book.condition}">
                    Used
                </p>

                <p class="price">
                    NPR <span th:text="${book.price}">
                    500
                </span>
                </p>

            </div>

            <a th:href="@{/cart/remove/{id}(id=${book.id})}"
               class="remove-button">
                Remove
            </a>

        </div>

        <div class="cart-bottom">

            <div class="total">

                Total:
                NPR <span th:text="${total}">
                0
            </span>

            </div>

            <!-- We will connect this in the next step -->

            <a href="/cart/checkout"
               class="checkout-button">
                Proceed to Checkout
            </a>

        </div>

    </div>


    <!-- EMPTY CART -->

    <div class="cart-container"
         th:if="${#lists.isEmpty(cart)}">

        <div class="empty-cart">

            <h2>Your cart is empty</h2>

            <p>
                You haven't added any books yet.
            </p>

            <a th:href="@{/product}"
               class="browse-button">
                Browse Books
            </a>

        </div>

    </div>
    

</main>

</body>

</html>
